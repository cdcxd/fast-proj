name: Release

# Push a tag like `v0.1.0` to publish packages/fast-proj via npm trusted publishing (OIDC; no token).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Check tag matches package version
        run: test "v$(node -p "require('./packages/fast-proj/package.json').version")" = "$GITHUB_REF_NAME"
      # Development tools require a newer Node; exercise the built package
      # on its advertised minimum before publishing, then restore the toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Node 20 package compatibility
        run: node packages/fast-proj/test/smoke.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        working-directory: packages/fast-proj
